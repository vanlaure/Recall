<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall Studio</title><link rel="stylesheet" href="/app.css"><header><a href="/">RECALL</a><span>Memory studio</span><button id="access">Access token</button></header><main><div class="layout"><aside><h2>Your memory kits</h2><button id="fresh">+ New kit</button><button id="refresh">Refresh library</button><div id="library"></div></aside><section><h1>Make a memory story.</h1><p id="config" role="status"></p><form id="create"><label for="source">Words to remember · review transcription before creating</label><textarea id="source" required maxlength="12000" placeholder="Speak, paste a passage, or enter a list."></textarea><div class="toolbar"><button type="button" id="record">● Record voice</button><label class="upload">Upload audio<input id="audio" type="file" accept="audio/*"></label></div><div class="options"><label>Input<select id="kind"><option value="passage">Passage / verse</option><option value="list">Word list</option></select></label><label>Learning module<select id="module"><option>Everyday memory</option><option>High school</option><option>College</option><option>Medical study</option><option>Bible verses</option><option>Older adults</option><option>Speeches</option></select></label><label>Recall goal<select id="mode"><option value="exact">Exact wording</option><option value="meaning">Meaning</option></select></label><label>Visual intensity<select id="absurdity"><option>Playful</option><option>Wild</option><option>Gentle</option></select></label></div><p>Audio is sent to your configured speech provider for transcription. The app retains the confirmed text; audio is not saved.</p><button class="primary" id="generate">Create storyboard</button></form><p id="status" role="status" aria-live="polite"></p><ol id="progress" aria-label="Agent progress" aria-live="polite"></ol><div id="kit"></div><details><summary>Memory techniques</summary><div id="techniques"></div></details></section></div></main><script type="module" src="/app.js"></script></html>
